
name: Update GVPN Servers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update_servers.yml"

permissions:
  contents: write

concurrency:
  group: update-gvpn-servers
  cancel-in-progress: false

jobs:
  update-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Update VPN Gate and VPNBook
        run: python scripts/update_servers.py

      - name: Validate JSON and config paths
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")

          for name in ("vpnbook", "vpngate"):
              path = root / "data" / f"{name}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              servers = data.get("servers", [])

              assert servers, f"{name}: no servers"

              for server in servers:
                  config = server.get("config_path")
                  assert config, f"{name}: missing config_path"
                  assert config.startswith(f"ovpn/{name}/")
                  assert config.endswith(".ovpn")

                  file_path = root / config
                  assert file_path.is_file(), (
                      f"{name}: missing {config}"
                  )

                  content = file_path.read_bytes()
                  text = content.decode("utf-8")

                  assert "client" in text.splitlines(), (
                      f"{name}: missing client directive in {config}"
                  )
                  assert any(
                      line.strip().startswith("remote ")
                      for line in text.splitlines()
                  ), f"{name}: missing remote directive in {config}"

                  expected_hash = (
                      server.get("sha256")
                      or server.get("config_sha256")
                  )

                  if expected_hash:
                      actual_hash = hashlib.sha256(
                          content
                      ).hexdigest()

                      assert actual_hash == expected_hash, (
                          f"{name}: SHA-256 mismatch for {config}"
                      )

                  if server.get("auth_required"):
                      auth = server.get("auth")
                      assert isinstance(auth, dict), (
                          f"{name}: missing auth object for {config}"
                      )
                      assert auth.get("username"), (
                          f"{name}: missing username for {config}"
                      )
                      assert auth.get("password"), (
                          f"{name}: missing password for {config}"
                      )

              print(
                  f"{name}: validated {len(servers)} profiles"
              )
          PY

      - name: Commit updated data and configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ ovpn/

          if ! git diff --cached --quiet; then
            git commit -m "Update VPN server data and OpenVPN configs"
            git push
          else
            echo "No changes to commit."
          fi
